<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 360" width="100%" height="100%">
  <rect width="450" height="360" fill="#ffffff"/>
  
  <!-- Axes -->
  <!-- X-axis -->
  <line x1="30" y1="270" x2="420" y2="270" stroke="#0f172a" stroke-width="2"/>
  <polygon points="425,270 415,266 415,274" fill="#0f172a"/>
  <text x="420" y="290" font-family="sans-serif" font-size="14" font-weight="bold" font-style="italic">x</text>

  <!-- Y-axis -->
  <line x1="225" y1="30" x2="225" y2="330" stroke="#0f172a" stroke-width="2"/>
  <polygon points="225,25 221,35 229,35" fill="#0f172a"/>
  <text x="215" y="32" font-family="sans-serif" font-size="14" font-weight="bold" font-style="italic" text-anchor="end">y</text>

  <!-- Origin O -->
  <circle cx="225" cy="270" r="3.5" fill="#0f172a"/>
  <text x="215" y="290" font-family="sans-serif" font-size="14" font-weight="bold" font-style="italic">O</text>

  <!-- Parabola: y = x^2 / k. Vertex at (225, 270). A is at (-2, 4) -> (155, 130), B is at (2, 4) -> (295, 130) -->
  <!-- Path through (120, 40), (155, 130), (225, 270), (295, 130), (330, 40) -->
  <path d="M 125 45 Q 225 325 325 45" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Square ABCD -->
  <!-- D: (155, 270), C: (295, 270), B: (295, 130), A: (155, 130) -->
  <polygon points="155,130 295,130 295,270 155,270" fill="#dbeafe" fill-opacity="0.3" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Points and Labels -->
  <circle cx="155" cy="130" r="4" fill="#0f172a"/>
  <text x="142" y="128" font-family="sans-serif" font-size="15" font-weight="bold">A</text>

  <circle cx="295" cy="130" r="4" fill="#0f172a"/>
  <text x="306" y="128" font-family="sans-serif" font-size="15" font-weight="bold">B</text>

  <circle cx="295" cy="270" r="4" fill="#0f172a"/>
  <text x="306" y="292" font-family="sans-serif" font-size="15" font-weight="bold">C</text>

  <circle cx="155" cy="270" r="4" fill="#0f172a"/>
  <text x="140" y="292" font-family="sans-serif" font-size="15" font-weight="bold">D</text>

  <text x="225" y="345" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">
    (Figure not drawn to scale)
  </text>
</svg>
