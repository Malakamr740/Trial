<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <rect width="240" height="220" fill="#ffffff" rx="8"/>
  <rect x="30" y="20" width="180" height="175" fill="#f8fafc" stroke="#334155" stroke-width="1.5" rx="4"/>
  
  <!-- Column Divider -->
  <line x1="120" y1="20" x2="120" y2="195" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Header Row Divider -->
  <line x1="30" y1="55" x2="210" y2="55" stroke="#334155" stroke-width="1.5"/>
  <!-- Row 1 Divider -->
  <line x1="30" y1="90" x2="210" y2="90" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Row 2 Divider -->
  <line x1="30" y1="125" x2="210" y2="125" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Row 3 Divider -->
  <line x1="30" y1="160" x2="210" y2="160" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Headers -->
  <text x="75" y="44" font-family="sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#0f172a" text-anchor="middle">x</text>
  <text x="165" y="44" font-family="sans-serif" font-size="16" font-weight="bold" font-style="italic" fill="#0f172a" text-anchor="middle">y</text>

  <!-- Row 1: -4, -9 -->
  <text x="75" y="79" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">-4</text>
  <text x="165" y="79" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">-9</text>

  <!-- Row 2: 0, -1 -->
  <text x="75" y="114" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">0</text>
  <text x="165" y="114" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">-1</text>

  <!-- Row 3: 2, 3 -->
  <text x="75" y="149" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">2</text>
  <text x="165" y="149" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">3</text>

  <!-- Row 4: p, 9 -->
  <text x="75" y="184" font-family="sans-serif" font-size="15" font-weight="bold" font-style="italic" fill="#2563eb" text-anchor="middle">p</text>
  <text x="165" y="184" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">9</text>
</svg>
