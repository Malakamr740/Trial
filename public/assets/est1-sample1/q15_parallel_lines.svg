<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <rect width="500" height="280" fill="#ffffff"/>
  
  <!-- Parallel lines d and d' -->
  <!-- Line d (top) -->
  <line x1="50" y1="150" x2="450" y2="70" stroke="#0f172a" stroke-width="2.5"/>
  <text x="45" y="145" font-family="sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#0f172a">d</text>
  
  <!-- Line d' (bottom, parallel) -->
  <line x1="70" y1="230" x2="470" y2="150" stroke="#0f172a" stroke-width="2.5"/>
  <text x="65" y="225" font-family="sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#0f172a">d'</text>
  
  <!-- Transversal 1 -->
  <line x1="190" y1="122" x2="270" y2="190" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Transversal 2 -->
  <line x1="380" y1="84" x2="310" y2="182" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Connecting segment between transversals along d' -->
  <line x1="270" y1="190" x2="310" y2="182" stroke="#0f172a" stroke-width="2"/>

  <!-- Angle a° (at bottom line d') -->
  <path d="M 255 193 A 18 18 0 0 1 268 180" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">a°</text>

  <!-- Angle b° (interior angle in quadrilateral) -->
  <path d="M 270 178 A 16 16 0 0 1 280 188" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="272" y="172" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">b°</text>

  <!-- Angle c° -->
  <path d="M 305 170 A 16 16 0 0 1 315 181" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="168" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">c°</text>

  <!-- Angle e° (at top right line d) -->
  <path d="M 370 86 A 16 16 0 0 1 378 100" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="382" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">e°</text>

  <text x="250" y="260" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">
    (Figure not drawn to scale)
  </text>
</svg>
