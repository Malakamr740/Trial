<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <rect width="460" height="280" fill="#ffffff"/>
  
  <!-- Isosceles Trapezoid ABCD:
       Top base AB = 10, bottom base CD = 16, legs AD = BC = 5.
       Height h = 4.
       Scaled coordinates:
       A = (150, 80), B = (310, 80) [width = 160px for base 10]
       D = (102, 210), C = (358, 210) [width = 256px for base 16]
       Height = 130px
  -->
  <polygon points="150,80 310,80 358,210 102,210" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Dashed altitude lines -->
  <line x1="150" y1="80" x2="150" y2="210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="310" y1="80" x2="310" y2="210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Right angle symbols -->
  <polyline points="150,196 164,196 164,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polyline points="310,196 296,196 296,210" fill="none" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- Vertices -->
  <circle cx="150" cy="80" r="4" fill="#0f172a"/>
  <text x="145" y="65" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">A</text>
  
  <circle cx="310" cy="80" r="4" fill="#0f172a"/>
  <text x="315" y="65" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">B</text>
  
  <circle cx="358" cy="210" r="4" fill="#0f172a"/>
  <text x="372" y="222" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">C</text>
  
  <circle cx="102" cy="210" r="4" fill="#0f172a"/>
  <text x="88" y="222" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">D</text>
  
  <!-- Dimension labels -->
  <text x="230" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">10</text>
  <text x="230" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">16</text>
  <text x="110" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">5</text>
  <text x="345" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569">5</text>
  <text x="165" y="150" font-family="sans-serif" font-size="13" font-style="italic" fill="#64748b">h</text>
  
  <text x="230" y="265" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">
    (Figure not drawn to scale)
  </text>
</svg>
