<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <rect width="450" height="450" fill="#ffffff"/>
  <defs>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
    <clipPath id="grid-clip">
      <rect x="50" y="30" width="350" height="350"/>
    </clipPath>
  </defs>

  <!-- Shaded Region above the line y = 0.5x - 3 -->
  <!-- At x = -5: y = -5.5 (clip bounds x=50, y=380) -->
  <!-- At x = 5: y = -0.5 (svg y = 225 - (-0.5)*35 = 242.5) -->
  <!-- Line points in svg: x=-5 is 50, y=-5.5 is 417.5. x=6 is 435, y=0 is 225 -->
  <polygon points="50,417.5 400,242.5 400,30 50,30" fill="#93c5fd" fill-opacity="0.6" clip-path="url(#grid-clip)"/>

  <!-- Background Grid -->
  <rect x="50" y="30" width="350" height="350" fill="url(#grid)" stroke="#64748b" stroke-width="1.5"/>

  <!-- Solid boundary line: y = 0.5x - 3 -->
  <!-- Passing through (-4, -5) -> (85, 400), (0, -3) -> (225, 330), (4, -1) -> (365, 260), (5, -0.5) -> (400, 242.5) -->
  <line x1="30" y1="427.5" x2="420" y2="232.5" stroke="#1e3a8a" stroke-width="2.5" clip-path="url(#grid-clip)"/>

  <!-- Axes -->
  <!-- Y-axis (x = 0 -> svg x = 225) -->
  <line x1="225" y1="15" x2="225" y2="395" stroke="#0f172a" stroke-width="2"/>
  <polygon points="225,10 221,22 229,22" fill="#0f172a"/>
  <text x="220" y="18" font-family="sans-serif" font-size="14" font-weight="bold" font-style="italic" text-anchor="end">y</text>

  <!-- X-axis (y = 0 -> svg y = 225) -->
  <line x1="35" y1="225" x2="415" y2="225" stroke="#0f172a" stroke-width="2"/>
  <polygon points="420,225 408,221 408,229" fill="#0f172a"/>
  <text x="420" y="242" font-family="sans-serif" font-size="14" font-weight="bold" font-style="italic">x</text>

  <!-- Axis numbers -->
  <!-- X ticks and labels -->
  <g font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">
    <text x="50" y="240">-5</text>
    <text x="85" y="240">-4</text>
    <text x="120" y="240">-3</text>
    <text x="155" y="240">-2</text>
    <text x="190" y="240">-1</text>
    <text x="215" y="240">0</text>
    <text x="260" y="240">1</text>
    <text x="295" y="240">2</text>
    <text x="330" y="240">3</text>
    <text x="365" y="240">4</text>
    <text x="400" y="240">5</text>
  </g>

  <!-- Y ticks and labels -->
  <g font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="end">
    <text x="218" y="54">5</text>
    <text x="218" y="89">4</text>
    <text x="218" y="124">3</text>
    <text x="218" y="159">2</text>
    <text x="218" y="194">1</text>
    <text x="218" y="264">-1</text>
    <text x="218" y="299">-2</text>
    <text x="218" y="334">-3</text>
    <text x="218" y="369">-4</text>
    <text x="218" y="404">-5</text>
  </g>
</svg>
