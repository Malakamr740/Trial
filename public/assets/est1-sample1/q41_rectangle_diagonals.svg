<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="100%">
  <rect width="460" height="300" fill="#ffffff"/>
  
  <!-- Rectangle ABCD (AB=8, BC=6) scaled to 240px by 180px -->
  <!-- A: (110, 240), B: (350, 240), C: (350, 60), D: (110, 60) -->
  <polygon points="110,240 350,240 350,60 110,60" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Diagonals AC and BD -->
  <line x1="110" y1="240" x2="350" y2="60" stroke="#2563eb" stroke-width="2"/>
  <line x1="110" y1="60" x2="350" y2="240" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Center E (230, 150) -->
  <circle cx="230" cy="150" r="4.5" fill="#2563eb"/>
  <text x="230" y="138" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">E</text>
  
  <!-- Vertices -->
  <circle cx="110" cy="240" r="4" fill="#0f172a"/>
  <text x="95" y="255" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">A</text>
  
  <circle cx="350" cy="240" r="4" fill="#0f172a"/>
  <text x="365" y="255" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">B</text>
  
  <circle cx="350" cy="60" r="4" fill="#0f172a"/>
  <text x="365" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">C</text>
  
  <circle cx="110" cy="60" r="4" fill="#0f172a"/>
  <text x="95" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">D</text>
  
  <!-- Dimension labels -->
  <!-- AB = 8 -->
  <text x="230" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">8</text>
  <!-- BC = 6 -->
  <text x="375" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">6</text>
  
  <!-- Right angle at A -->
  <polyline points="110,224 126,224 126,240" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  
  <text x="230" y="290" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">
    (Figure not drawn to scale)
  </text>
</svg>
