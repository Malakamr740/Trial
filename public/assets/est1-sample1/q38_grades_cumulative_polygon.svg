<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%">
  <rect width="460" height="380" fill="#ffffff"/>

  <!-- Title / Y Label -->
  <text x="180" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">
    Decreasing cumulative frequency
  </text>

  <!-- X-axis Label -->
  <text x="350" y="325" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">
    Grades
  </text>

  <!-- Axes:
       Origin at x=80, y=320.
       X range 0 to 80 (dx = 3px per grade unit: 0=80, 20=140, 40=200, 60=260, 80=320)
       Y range 0 to 45 (dy = 5.5px per unit: 0=320, 5=292.5, 10=265, 15=237.5, 20=210, 25=182.5, 30=155, 35=127.5, 40=100, 45=72.5)
  -->

  <!-- Y axis line & arrow -->
  <line x1="80" y1="50" x2="80" y2="320" stroke="#0f172a" stroke-width="2"/>
  <polygon points="80,45 76,57 84,57" fill="#0f172a"/>

  <!-- X axis line & arrow -->
  <line x1="80" y1="320" x2="340" y2="320" stroke="#0f172a" stroke-width="2"/>
  <polygon points="345,320 333,316 333,324" fill="#0f172a"/>

  <!-- Ticks and Labels Y -->
  <g font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="end">
    <line x1="75" y1="72.5" x2="80" y2="72.5" stroke="#0f172a"/>
    <text x="72" y="76">45</text>
    <line x1="75" y1="100" x2="80" y2="100" stroke="#0f172a"/>
    <text x="72" y="104">40</text>
    <line x1="75" y1="127.5" x2="80" y2="127.5" stroke="#0f172a"/>
    <text x="72" y="131.5">35</text>
    <line x1="75" y1="155" x2="80" y2="155" stroke="#0f172a"/>
    <text x="72" y="159">30</text>
    <line x1="75" y1="182.5" x2="80" y2="182.5" stroke="#0f172a"/>
    <text x="72" y="186.5">25</text>
    <line x1="75" y1="210" x2="80" y2="210" stroke="#0f172a"/>
    <text x="72" y="214">20</text>
    <line x1="75" y1="237.5" x2="80" y2="237.5" stroke="#0f172a"/>
    <text x="72" y="241.5">15</text>
    <line x1="75" y1="265" x2="80" y2="265" stroke="#0f172a"/>
    <text x="72" y="269">10</text>
    <line x1="75" y1="292.5" x2="80" y2="292.5" stroke="#0f172a"/>
    <text x="72" y="296.5">5</text>
  </g>

  <!-- Ticks and Labels X -->
  <g font-family="sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">
    <text x="80" y="336">0</text>
    <line x1="140" y1="320" x2="140" y2="325" stroke="#0f172a"/>
    <text x="140" y="336">20</text>
    <line x1="200" y1="320" x2="200" y2="325" stroke="#0f172a"/>
    <text x="200" y="336">40</text>
    <line x1="260" y1="320" x2="260" y2="325" stroke="#0f172a"/>
    <text x="260" y="336">60</text>
    <line x1="320" y1="320" x2="320" y2="325" stroke="#0f172a"/>
    <text x="320" y="336">80</text>
  </g>

  <!-- Curve line points:
       (20, 40) -> (140, 100)
       (26, 38) -> (158, 111)
       (35, 34) -> (185, 133)
       (50, 24) -> (230, 188)
       (60, 10) -> (260, 265)
       (70, 0)  -> (290, 320)
  -->
  <path d="M 140 100 Q 170 120 185 133 T 230 188 L 260 265 L 290 320" fill="none" stroke="#0f172a" stroke-width="2"/>

  <!-- Plotted hollow dots -->
  <circle cx="140" cy="100" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="158" cy="111" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="185" cy="133" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="230" cy="188" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="260" cy="265" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="290" cy="320" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
</svg>
