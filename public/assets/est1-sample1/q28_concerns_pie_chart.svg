<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 360" width="100%" height="100%">
  <rect width="450" height="360" fill="#ffffff"/>
  
  <g transform="translate(225, 180)">
    <!-- 39% Health care: 0 to 140.4 deg -->
    <!-- Angles from -90 deg (12 o'clock) -->
    <!-- Health care: -90 to 50.4 deg (angle = 140.4 deg). Cos/Sin for r=120: -->
    <!-- -90 deg: (0, -120). 50.4 deg: (120*cos(50.4)=76.5, 120*sin(50.4)=92.5) -->
    <path d="M 0 0 L 0 -120 A 120 120 0 0 1 76.5 92.5 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    
    <!-- 15% University education: 50.4 to 104.4 deg (angle = 54 deg). 104.4 deg: (120*cos(104.4)=-29.8, 120*sin(104.4)=116.2) -->
    <path d="M 0 0 L 76.5 92.5 A 120 120 0 0 1 -29.8 116.2 Z" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
    
    <!-- 26% School education: 104.4 to 198 deg (angle = 93.6 deg). 198 deg: (120*cos(198)=-114.1, 120*sin(198)=-37.1) -->
    <path d="M 0 0 L -29.8 116.2 A 120 120 0 0 1 -114.1 -37.1 Z" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
    
    <!-- 12% Vaccinations: 198 to 241.2 deg (angle = 43.2 deg). 241.2 deg: (120*cos(241.2)=-57.8, 120*sin(241.2)=-105.1) -->
    <path d="M 0 0 L -114.1 -37.1 A 120 120 0 0 1 -57.8 -105.1 Z" fill="#fef08a" stroke="#ffffff" stroke-width="2"/>
    
    <!-- 8% Economic crisis: 241.2 to 270 deg (angle = 28.8 deg). Ends at (0, -120) -->
    <path d="M 0 0 L -57.8 -105.1 A 120 120 0 0 1 0 -120 Z" fill="#60a5fa" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Labels -->
  <!-- Health care (in slice / callout) -->
  <g font-family="sans-serif" text-anchor="middle">
    <!-- Health care box -->
    <rect x="270" y="80" width="85" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="312" y="98" font-size="12" font-weight="bold" fill="#0f172a">Health care</text>
    <text x="312" y="114" font-size="13" font-weight="bold" fill="#0284c7">39%</text>

    <!-- University education box -->
    <rect x="235" y="240" width="105" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="287" y="258" font-size="11" font-weight="bold" fill="#0f172a">University edu.</text>
    <text x="287" y="274" font-size="13" font-weight="bold" fill="#ea580c">15%</text>

    <!-- School education box -->
    <rect x="65" y="210" width="95" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="112" y="228" font-size="11" font-weight="bold" fill="#0f172a">School edu.</text>
    <text x="112" y="244" font-size="13" font-weight="bold" fill="#475569">26%</text>

    <!-- Vaccinations box -->
    <rect x="55" y="75" width="100" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="94" font-size="12" font-weight="bold" fill="#854d0e">Vaccinations</text>

    <!-- Economic crisis box -->
    <rect x="155" y="25" width="105" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="207" y="44" font-size="12" font-weight="bold" fill="#1d4ed8">Economic crisis</text>
  </g>
</svg>
