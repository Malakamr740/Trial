<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="100%">
  <rect width="460" height="320" fill="#ffffff"/>

  <!-- Triangle ABC:
       B is top-left (140, 50)
       A is bottom-left (140, 250)
       C is right (380, 180)
       Line BC goes from (140, 50) to (380, 180).
       D is on BC such that AD is perpendicular to BC.
       Let's compute coordinates nicely:
       B = (140, 50)
       A = (140, 260)
       AB is vertical line.
       C = (380, 180)
       E is on AB (so x=140). CE is horizontal if angle is 90 deg!
       If CE is perpendicular to BA (which is vertical), then CE is horizontal line from (140, 180) to (380, 180)!
       So E = (140, 180)!
       Then BE = 180 - 50 = 130 in px (represents 6).
       Let's check D on BC: AD perpendicular to BC.
       Vector BC = C - B = (240, 130).
       AD dot BC = 0.
  -->

  <!-- Triangle ABC -->
  <!-- A = (150, 250), B = (150, 60), C = (390, 190) -->
  <polygon points="150,250 150,60 390,190" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Altitude CE: from C(390, 190) to E on BA(150, 190) -->
  <line x1="390" y1="190" x2="150" y2="190" stroke="#2563eb" stroke-width="2"/>
  <!-- Right angle marker at E (150, 190) -->
  <rect x="150" y="176" width="14" height="14" fill="none" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Altitude AD: from A(150, 250) to D on BC -->
  <!-- Line BC passes through (150, 60) and (390, 190). Slope = 130/240 = 13/24 -->
  <!-- D is around (218, 97) -->
  <line x1="150" y1="250" x2="218" y2="97" stroke="#2563eb" stroke-width="2"/>
  <!-- Right angle marker at D (218, 97) oriented along BC and AD -->
  <polygon points="218,97 212,110 223,116 229,103" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Points and vertex dots -->
  <circle cx="150" cy="60" r="3.5" fill="#0f172a"/>
  <text x="145" y="48" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">B</text>

  <circle cx="150" cy="250" r="3.5" fill="#0f172a"/>
  <text x="145" y="272" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">A</text>

  <circle cx="390" cy="190" r="3.5" fill="#0f172a"/>
  <text x="402" y="195" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">C</text>

  <circle cx="150" cy="190" r="3" fill="#2563eb"/>
  <text x="132" y="195" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">E</text>

  <circle cx="218" cy="97" r="3" fill="#2563eb"/>
  <text x="220" y="85" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">D</text>

  <text x="230" y="300" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">
    (Figure not drawn to scale)
  </text>
</svg>
