<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <rect width="520" height="220" fill="#ffffff" rx="8"/>
  <rect x="20" y="20" width="480" height="180" fill="#f8fafc" stroke="#334155" stroke-width="1.5" rx="4"/>
  
  <!-- Column Divider (Student: 110px, Statement: 370px) -->
  <line x1="130" y1="20" x2="130" y2="200" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Header Row Divider -->
  <line x1="20" y1="56" x2="500" y2="56" stroke="#334155" stroke-width="1.5"/>
  <!-- Row 1 Divider -->
  <line x1="20" y1="92" x2="500" y2="92" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Row 2 Divider -->
  <line x1="20" y1="128" x2="500" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Row 3 Divider -->
  <line x1="20" y1="164" x2="500" y2="164" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Headers -->
  <text x="75" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Student</text>
  <text x="315" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Statement</text>

  <!-- Row 1: Maya -->
  <text x="75" y="80" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Maya</text>
  <text x="145" y="80" font-family="sans-serif" font-size="13" fill="#1e293b">The curve admits a center of symmetry of coordinates (1, 0)</text>

  <!-- Row 2: Tarek -->
  <text x="75" y="116" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Tarek</text>
  <text x="145" y="116" font-family="sans-serif" font-size="13" fill="#1e293b">The curve admits two vertices</text>

  <!-- Row 3: Mirna -->
  <text x="75" y="152" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Mirna</text>
  <text x="145" y="152" font-family="sans-serif" font-size="13" fill="#1e293b">The curve admits an asymptote of equation y = 1</text>

  <!-- Row 4: Samir -->
  <text x="75" y="188" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Samir</text>
  <text x="145" y="188" font-family="sans-serif" font-size="13" fill="#1e293b">The range of the function is ℝ</text>
</svg>
